<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal Valentina: Iris to Cyan -->
    <linearGradient id="valGradient" x1="120" y1="130" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Resplandor sutil (Glow) -->
    <filter id="valGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Isotipo Valentina: Cinta Geométrica Continua en V -->
  <g filter="url(#valGlow)">
    <!-- Brazo Izquierdo (Trazo Exterior) -->
    <path d="M120 136L228 376C242 406 270 406 284 376L392 136" 
          stroke="url(#valGradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Brazo Interior con Bucle / Cinta Continua -->
    <path d="M168 136L236 294C244 312 268 312 276 294L344 136" 
          stroke="url(#valGradient)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.85"/>

    <!-- Nodo Central de Retorno / Núcleo de Precisión -->
    <circle cx="256" cy="356" r="14" fill="#06B6D4" opacity="0.9"/>
  </g>
</svg>
