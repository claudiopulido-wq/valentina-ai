name: Platform CI

# Antes de este workflow, cada `git push` a main desplegaba directo a
# producción sin build gate, lint gate ni test gate (auditoría, sección 4.3).
# Este pipeline no reemplaza el despliegue de Vercel: corre en paralelo como
# verificación obligatoria de tipos, estilo, tests y build antes de fusionar.
on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'

defaults:
  run:
    working-directory: platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/realtime-js (usado por conversationsService.ts) requiere
          # el WebSocket nativo de Node 22+; con Node 20 el import falla con
          # "Node.js detected but native WebSocket not found" incluso en
          # pruebas que no usan Realtime, porque supabaseClient.ts construye
          # el cliente al cargarse el módulo.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true # Hay deuda de lint preexistente (ver auditoría); no bloquea aún, solo reporta.

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          # Valores placeholder: el build no necesita conectividad real a
          # Supabase, solo que las variables existan para que Next.js no
          # falle al inicializar los clientes en tiempo de build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
